<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | WeatherGPT</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-center">
  <div class="auth-card auth-single">
    <div class="auth-icon">🔐</div>
    <div class="auth-card-head">
      <div><h2>Reset your password</h2><p>Enter your registered email address.</p></div>
    </div>
    <form id="forgotForm" novalidate>
      <div class="auth-field">
        <label for="forgotEmail">Email address</label>
        <input id="forgotEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <small class="field-error" data-error-for="forgotEmail"></small>
      </div>
      <button class="auth-primary" type="submit">Send Reset Link →</button>
      <div id="resetMessage" class="ai-bubble hidden"></div>
      <p class="auth-switch"><a href="login.html">← Back to Sign In</a></p>
      <p class="auth-note">This frontend demo cannot send a real email. A production version should connect this flow to an authentication provider.</p>
    </form>
  </div>
</div>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="auth.js"></script>
</body>
</html>
